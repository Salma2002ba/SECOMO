# Déploiement du frontend SECOMO sur GitHub Pages
# URL : https://<username>.github.io/SECOMO/

name: Deploy to GitHub Pages

on:
  push:
    branches: [arthur]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Utilise les Repository variables (Settings → Secrets and variables → Actions → Variables)
      # pour que VITE_API_BASE / VITE_WS_BASE soient injectés au build Vite.
      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WS_BASE: ${{ vars.VITE_WS_BASE }}
        run: cd frontend && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Debug dist exists
        run: |
          ls -la frontend/dist
          test -f frontend/dist/index.html

      - name: Copy dist to repo root (for branch-based Pages)
        # This makes the site work even if Pages is currently set to "Deploy from a branch"
        if: github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          rm -rf assets
          cp -f frontend/dist/index.html ./index.html
          cp -r frontend/dist/assets ./assets
          # Fichiers public/ (Vite les met à la racine de dist) : images, favicon, etc.
          shopt -s nullglob
          for f in frontend/dist/*; do
            if [[ -f "$f" ]]; then
              cp -f "$f" ./
            fi
          done

      - name: Commit root files (only if changed)
        if: github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          shopt -s nullglob
          for f in *.png *.jpg *.jpeg *.svg *.ico *.webp; do
            [[ -f "$f" ]] && git add "$f" || true
          done
          git commit -m "chore: deploy built frontend to Pages root" || true
          git push origin HEAD:arthur

  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
